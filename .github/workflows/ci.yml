name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # github.com/Daniel-dev22/agent-kit-go is still private. Give the Go
      # toolchain the workflow token so `go mod download` can fetch it; when the
      # module is public this step becomes a harmless no-op.
      - name: Configure module access
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/Daniel-dev22/*" >> "$GITHUB_ENV"

      - run: go mod download

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./... -count=1
